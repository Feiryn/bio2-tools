name: Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: bio2_tools-linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            artifact_name: bio2_tools-windows-x86_64
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build all tools
        run: cargo build --release --workspace

      - name: Collect binaries (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          for bin in aio_iob_dumper bio2_flash bio2_flash_dumper bio2_ident biovideo_crypt generate_mot; do
            cp target/release/$bin dist/
          done

      - name: Collect binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($bin in @("aio_iob_dumper", "bio2_flash", "bio2_flash_dumper", "bio2_ident", "biovideo_crypt", "generate_mot")) {
            Copy-Item "target/release/$bin.exe" dist/
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
          if-no-files-found: error
